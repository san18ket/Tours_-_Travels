; Enterprise Tours & Travels - Recommended Production PHP OPcache Configuration
; Place these directives into your server php.ini, conf.d/10-opcache.ini, or cPanel PHP selector.

[opcache]
; Enable OPcache for web requests
opcache.enable = 1

; Disable for CLI by default unless running background workers
opcache.enable_cli = 0

; Memory size allocated to OPcache in megabytes (128MB is optimal for shared/VPS hosting)
opcache.memory_consumption = 128

; Memory size for interned strings in megabytes
opcache.interned_strings_buffer = 16

; Maximum number of cached PHP script files
opcache.max_accelerated_files = 10000

; Validate script timestamps automatically during deployments
opcache.validate_timestamps = 1

; Revalidation frequency in seconds (checks file changes every 2 seconds without performance overhead)
opcache.revalidate_freq = 2

; Preserve docblock comments required by frameworks and annotations
opcache.save_comments = 1

; Faster code shutdown sequence
opcache.fast_shutdown = 1
